# Three equal masses chasing each other along one figure-eight curve: a
# periodic solution of the three-body problem found numerically by C. Moore
# (1993) and proved to exist by Chenciner & Montgomery (2000).
#
# It is an excellent integrator test: after each period T the bodies must
# return exactly to their starting points, and any numerical error shows up
# as the eight slowly smearing out. Try `integrator: euler` to see it fall apart.

name: Figure-Eight Choreography
description: Three equal masses on a single figure-eight orbit (Chenciner & Montgomery, 2000).

units: nbody                         # G = 1, all quantities dimensionless

simulation:
  duration: 3 * 6.32591398           # three periods, T = 6.32591398
  dt: 0.001
  integrator: yoshida4
  barycentric: true

render:
  duration: 15                       # 5 s of video per period
  scale: 3.0
  trail: 5                           # exactly one period: the full eight
  trail_width: 3
  hud: true
  camera: {phi: 0, theta: 0, zoom: 1.0, rotation: 0}   # top view

bodies:
  - name: A
    mass: 1
    position: [0.97000436, -0.24308753]
    velocity: [0.466203685, 0.43236573]
    radius: 0.09
    color: "#ff595e"
  - name: B
    mass: 1
    position: [-0.97000436, 0.24308753]
    velocity: [0.466203685, 0.43236573]
    radius: 0.09
    color: "#ffca3a"
  - name: C
    mass: 1
    position: [0, 0]
    velocity: [-0.93240737, -0.86473146]
    radius: 0.09
    color: "#1982c4"
